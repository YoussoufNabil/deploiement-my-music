services:
  db:
    image: mysql:8.0
    container_name: my-music-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-my_music}
      MYSQL_USER: ${DB_USER:-app_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_this_local_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_this_root_password}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-change_this_root_password}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [my-music-network]

  app:
    build: .
    container_name: my-music-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      STORAGE_DRIVER: local
      LOCAL_UPLOAD_DIR: /app/storage/uploads
      PORT: 3000
      HOST: 0.0.0.0
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/storage/uploads
    networks: [my-music-network]

volumes:
  mysql_data:
  uploads_data:

networks:
  my-music-network:
    driver: bridge
