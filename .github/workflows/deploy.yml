name: Build and deploy My Music

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "database/**"
      - "Dockerfile"
      - "package.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: my-music-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, push to ECR and deploy through SSM
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      DB_HOST: ${{ vars.DB_HOST }}
      DB_USER: ${{ vars.DB_USER }}
      DB_NAME: ${{ vars.DB_NAME }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" .
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker tag "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

      - name: Deploy image on EC2 through Systems Manager
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          for name in AWS_REGION ECR_REGISTRY ECR_REPOSITORY EC2_INSTANCE_ID DB_HOST DB_USER DB_NAME S3_BUCKET; do
            if [ -z "${!name:-}" ]; then echo "Missing GitHub Actions variable: ${name}"; exit 1; fi
          done
          COMMANDS=$(jq -n \
            --arg region "$AWS_REGION" \
            --arg registry "$ECR_REGISTRY" \
            --arg repository "$ECR_REPOSITORY" \
            --arg tag "$IMAGE_TAG" \
            --arg dbhost "$DB_HOST" \
            --arg dbuser "$DB_USER" \
            --arg dbname "$DB_NAME" \
            --arg bucket "$S3_BUCKET" \
            '[
              "set -euo pipefail",
              ("aws ecr get-login-password --region " + $region + " | docker login --username AWS --password-stdin " + $registry),
              ("docker pull " + $registry + "/" + $repository + ":" + $tag),
              "docker stop my-music 2>/dev/null || true",
              "docker rm my-music 2>/dev/null || true",
              ("JWT_SECRET=$(aws ssm get-parameter --name /my-music/prod/jwt_secret --with-decryption --region " + $region + " --query Parameter.Value --output text); docker run -d --name my-music --restart unless-stopped --log-driver awslogs --log-opt awslogs-region=" + $region + " --log-opt awslogs-group=/my-music/application --log-opt awslogs-create-stream=true -p 3000:3000 -e NODE_ENV=production -e PORT=3000 -e HOST=0.0.0.0 -e AWS_REGION=" + $region + " -e STORAGE_DRIVER=s3 -e S3_BUCKET=" + $bucket + " -e DB_HOST=" + $dbhost + " -e DB_PORT=3306 -e DB_USER=" + $dbuser + " -e DB_NAME=" + $dbname + " -e DB_PASSWORD_PARAMETER=/my-music/prod/app_db_password -e JWT_SECRET=\"$JWT_SECRET\" -e COOKIE_SECURE=false " + $registry + "/" + $repository + ":" + $tag),
              "docker ps --filter name=my-music",
              "curl --fail --silent --show-error http://127.0.0.1:3000/health"
            ] | {commands: .}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy My Music ${IMAGE_TAG}" \
            --parameters "$COMMANDS" \
            --query 'Command.CommandId' --output text)
          echo "SSM Command ID: ${COMMAND_ID}"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}'
